services:
  postgres:
    image: postgres:16
    container_name: extractionrpg-postgres
    environment:
      POSTGRES_DB: extractionrpg
      POSTGRES_USER: extractionrpg
      POSTGRES_PASSWORD: extractionrpg
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: extractionrpg-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
